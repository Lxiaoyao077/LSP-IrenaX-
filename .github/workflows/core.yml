name: Core

on:
  workflow_dispatch:
  push:
    branches: [ dev ]
    tags: [ v* ]
  pull_request:
  merge_group:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"
      CCACHE_BASEDIR: "${{ github.workspace }}"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # libxposed/api and libxposed/service are private, so a recursive submodule
          # update aborts on them and leaves every other submodule empty behind it.
          submodules: false
          fetch-depth: 0

      - name: Fetch the public submodules
        run: |
          git submodule sync
          for path in external/system_properties external/xz-embedded external/lsplant external/dobby external/fmt external/plti; do
            echo "== $path"
            git submodule update --init --force --recursive "$path" || echo "could not fetch $path"
          done
          git submodule status

      - name: Stand in for the private service interface
        # :libxposed:service takes its sources from the private libxposed/service submodule, and
        # :daemon extends IXposedService.Stub, so nothing that depends on it can be compiled here
        # without the interface. Drop the vendored copy into the path the module expects.
        run: |
          target=libxposed/service/service/interface/src/main/aidl
          mkdir -p "$target"
          cp -r .github/ci-stubs/io "$target/"

      - name: Write key
        if: ${{ ( github.event_name != 'pull_request' && github.ref == 'refs/heads/dev' ) || github.ref_type == 'tag' }}
        run: |
          if [ ! -z "${{ secrets.KEY_STORE }}" ]; then
            echo androidStorePassword='${{ secrets.KEY_STORE_PASSWORD }}' >> gradle.properties
            echo androidKeyAlias='${{ secrets.ALIAS }}' >> gradle.properties
            echo androidKeyPassword='${{ secrets.KEY_PASSWORD }}' >> gradle.properties
            echo androidStoreFile='key.jks' >> gradle.properties
            echo ${{ secrets.KEY_STORE }} | base64 --decode > key.jks
          fi

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          log-accepted-android-sdk-licenses: 'false'
          packages: ''

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
            max-size: 2G
            key: ${{ runner.os }}
            restore-keys: ${{ runner.os }}
            save: ${{ github.event_name == 'push' && github.ref == 'refs/heads/dev' }}

      - name: Setup Ninja
        uses: seanmiddleditch/gha-setup-ninja@master
        with:
          version: 1.12.1

      - name: Remove Android's cmake
        shell: bash
        run: rm -rf $ANDROID_HOME/cmake

      - name: Configure Gradle properties
        run: |
          echo 'org.gradle.caching=true' >> ~/.gradle/gradle.properties
          echo 'org.gradle.parallel=true' >> ~/.gradle/gradle.properties
          echo 'org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8 -XX:+UseParallelGC' >> ~/.gradle/gradle.properties
          echo 'android.native.buildOutput=verbose' >> ~/.gradle/gradle.properties

      - name: Build the loader, the framework JNI and the daemon
        # :daemon's only private dependency is the service interface, which the step above
        # provides, so its sources - reload dispatch included - can be compiled after all.
        run: |
          ./gradlew :magisk-loader:assembleZygiskDebug :daemon:compileDebugJavaWithJavac --stacktrace
